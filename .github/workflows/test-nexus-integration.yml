name: Nexus 1 · Linux Electron integration (no release)
on:
  push:
    branches: [feat/air-os-nexus-1-system-integrations]
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: air-nexus-linux
  cancel-in-progress: false
jobs:
  electron:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      gate: ${{ steps.gate.outcome }}
      sandbox: ${{ steps.sandbox.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Frozen dependency installation and mandatory audit
        run: |
          npm ci --prefix build/windows-x64 --ignore-scripts --no-fund --no-audit
          npm audit --prefix build/windows-x64 --audit-level=high
          node scripts/windows-test-build.cjs link
          node build/windows-x64/node_modules/electron/install.js
      - name: Complete source and regression gate
        id: gate
        run: |
          node scripts/windows-test-build.cjs validate
          node scripts/run-test-gate.cjs
      - name: Configure Chromium supplied sandbox (never disable)
        id: sandbox
        run: |
          sudo chown root:root build/windows-x64/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 build/windows-x64/node_modules/electron/dist/chrome-sandbox
      - name: Identical R7 baseline Electron scenes
        env:
          AIR_GUI_TEST_ISOLATED: '1'
          AIR_R1_EXE: build/windows-x64/node_modules/electron/dist/electron
          AIR_R1_APP: dist/nexus-baseline
          AIR_R1_OUTPUT: dist/nexus-evidence/before
          AIR_NEXUS_SCENES: '1'
          AIR_ORIGIN_BEFORE: '1'
        run: |
          git worktree add --quiet --detach dist/nexus-baseline 02ccaf88724731cf685d2221f88e959020aff3f0
          ln -s "$GITHUB_WORKSPACE/node_modules" dist/nexus-baseline/node_modules
          xvfb-run -a -s '-screen 0 1920x1080x24' node scripts/check-tahoe7.cjs
      - name: Nexus shelf, timer, reminders, profiles and native fullscreen
        env:
          AIR_GUI_TEST_ISOLATED: '1'
          AIR_R1_EXE: build/windows-x64/node_modules/electron/dist/electron
          AIR_R1_APP: .
          AIR_R1_OUTPUT: dist/nexus-evidence/after
          AIR_NEXUS_SCENES: '1'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' node scripts/check-tahoe7.cjs
      - name: Existing stages, group M2, geometry, touch, keyboard and restart
        env:
          AIR_GUI_TEST_ISOLATED: '1'
          AIR_R1_EXE: build/windows-x64/node_modules/electron/dist/electron
          AIR_R1_APP: .
          AIR_R1_OUTPUT: dist/nexus-evidence/stages
          AIR_ORIGIN_SCENES: '1'
          AIR_ORIGIN2_SCENES: '1'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' node scripts/check-tahoe7.cjs
      - name: Separate software shader diagnostic and resource cleanup
        if: ${{ !cancelled() && steps.gate.outcome == 'success' && steps.sandbox.outcome == 'success' }}
        env:
          AIR_GUI_TEST_ISOLATED: '1'
          AIR_R1_EXE: build/windows-x64/node_modules/electron/dist/electron
          AIR_R1_APP: .
          AIR_R1_OUTPUT: dist/nexus-evidence/materials
          AIR_ORIGIN_MATERIAL: '1'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' node scripts/check-tahoe7.cjs
      - name: Save synthetic test evidence (no website publication)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Air-OS-Nexus1-Linux-${{ github.sha }}
          path: |
            dist/nexus-evidence/
            dist/r1-gui/node-tests.tap
          retention-days: 30
  save-synthetic-evidence:
    needs: electron
    if: ${{ !cancelled() && needs.electron.outputs.gate == 'success' && needs.electron.outputs.sandbox == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: Air-OS-Nexus1-Linux-${{ github.sha }}
          path: dist
      - name: Save allowlisted screenshots to this source-leased feature branch
        env:
          NEXUS_DEBUG_EVIDENCE: ${{ needs.electron.result != 'success' && '1' || '0' }}
        run: node scripts/publish-nexus-evidence.cjs
  linux-package-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Frozen dependencies and security gate
        run: |
          npm ci --prefix build/windows-x64 --ignore-scripts --no-audit --no-fund
          npm audit --prefix build/windows-x64 --audit-level=high
          node scripts/windows-test-build.cjs link
          node scripts/run-test-gate.cjs
      - name: Build application DEB only (no installation or host configuration)
        run: |
          node scripts/linux-nexus-build.cjs build
          sha256sum dist/linux-nexus/*.deb > dist/linux-nexus/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Air-OS-Nexus1-Linux-DEB-prototype-${{ github.sha }}
          path: |
            dist/linux-nexus/*.deb
            dist/linux-nexus/SHA256SUMS.txt
          if-no-files-found: error
