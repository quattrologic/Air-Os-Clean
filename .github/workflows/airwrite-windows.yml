name: AirWrite Windows installer
on:
  push:
    branches: [feature/airwrite-finish]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run pack:win
      - uses: actions/upload-artifact@v4
        with:
          name: AirWrite-Windows-Installer
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
