name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check app.js
          node --check air-os-enhancements.js
          node --check aircard-lite.js
      - name: Audit production and development dependencies
        run: npm audit --audit-level=high
      - name: Check for accidentally tracked private files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)(\.env($|\.)|id_(rsa|ed25519)|.*\.(pem|p12|pfx|key)$|accounts\.json$|\.DS_Store$)' ; then
            echo 'Potentially sensitive file tracked in git' >&2
            exit 1
          fi
