name: Build Air-OS desktop installers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax and package metadata
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check app.js
          node --check air-os-enhancements.js
          node --check aircard-lite.js
          node --check login.js
          node --check air-music.js
          node --check air-arcade-games.js
          node scripts/check-catalina.cjs
          node -e "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8'))"

  build-windows:
    needs: validate-source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run pack:win
      - name: Upload Windows test installers (not a public release)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Air-OS-Windows-test
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7

  build-macos:
    needs: validate-source
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run pack:mac
      - name: Upload macOS test installers (not a public release)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Air-OS-macOS-test
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 7
