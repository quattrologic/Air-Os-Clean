name: Build Air-OS desktop installers

on:
  pull_request:
    branches: [main, feat/air-os-architecture-foundation]
  push:
    branches: [main, build/air-ultimate-test-installers-20261023]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: air-os-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax and package metadata
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check app.js
          node --check air-os-enhancements.js
          node --check aircard-lite.js
          node --check login.js
          node --check air-music.js
          node --check air-arcade-games.js
          node --check air-reminders.js
          node --check air-spotlight.js
          node --check src/main/reminders-store.cjs
          node --check src/main/file-search.cjs
          node scripts/check-catalina.cjs
          node -e "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8'))"

  build-windows:
    needs: validate-source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Run Windows regression tests before packaging
        run: npm test
      - name: Prepare identifiable development version
        run: node scripts/test-build.cjs prepare
      - run: npm run pack:win
      - name: Verify packages and collect installers with SHA-256
        run: node scripts/test-build.cjs collect windows
      - name: Upload Windows x64 test installer (not a public release)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Air-OS-Windows-x64-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/test-artifacts/windows-x64/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows ARM64 test installer
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Air-OS-Windows-ARM64-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/test-artifacts/windows-arm64/*
          if-no-files-found: error
          retention-days: 14

  build-macos:
    needs: validate-source
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Run macOS regression tests before packaging
        run: npm test
      - name: Prepare identifiable development version
        run: node scripts/test-build.cjs prepare
      - run: npm run pack:mac
      - name: Verify packages and collect installers with SHA-256
        run: node scripts/test-build.cjs collect macos
      - name: Upload macOS Universal test DMG (not a public release)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Air-OS-macOS-Universal-DMG-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/test-artifacts/macos-universal-dmg/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload macOS Universal test ZIP
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Air-OS-macOS-Universal-ZIP-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/test-artifacts/macos-universal-zip/*
          if-no-files-found: error
          retention-days: 14
